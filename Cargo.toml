[package]
name = "reliabletxt"
version = "0.1.0"
edition = "2024"
description = "Reader and writer for ReliableTXT UTF-8 text files"

[lib]
crate-type = ["cdylib"]
name = "_reliabletxt"

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
